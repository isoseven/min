# Live-editable Hyprland config.
#
# Sourced from hyprland.nix's `extraConfig`. On the `nixos-impure` build
# this file is symlinked straight from your working tree (via
# `impurity.link` in hyprland.nix), so edits here take effect with just
# `hyprctl reload` — no rebuild needed. On the normal pure build it's an
# ordinary nix-store copy.
#
# monitor / exec-once / env / input / plugins / plugin.overview /
# windowrule stay in hyprland.nix's Nix `settings` block instead — plugins
# because it needs a Nix derivation path, windowrule because its nested
# match{} syntax is easier to get right via Home Manager's typed option.

$mod = SUPER
$terminal = alacritty
$fileManager = thunar
$menu = rofi -show drun

# Catppuccin Mocha palette reference (hex, no leading '#'):
#   mauve = cba6f7   lavender = b4befe   base = 1e1e2e   crust = 11111b
# Hyprland's $var syntax can't cleanly concatenate a suffix onto a
# variable (no "${var}ee"-style interpolation), so the alpha-blended
# values below are just written out in full rather than composed.

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(b4befeee) 45deg
    col.inactive_border = rgba(11111baa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 0.97
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(11111bcc)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1

    animation = windows, 1, 5, easeOutQuint
    animation = windowsIn, 1, 5, easeOutQuint, popin 87%
    animation = windowsOut, 1, 5, easeOutQuint, popin 87%
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, easeOutQuint, slide
    animation = border, 1, 8, default
}

dwindle {
    # pseudotile = true
    preserve_split = true
}

gesture = 3, horizontal, workspace

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(1e1e2e)
}

# --- Keybindings -----------------------------------------------------
bind = $mod, RETURN, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, W, killactive,
bind = $mod SHIFT, M, exit,
bind = $mod, E, exec, $fileManager
bind = $mod, V, togglefloating,
bind = $mod, R, exec, $menu
bind = $mod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mod, P, pseudo,
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, F, fullscreen,
bind = $mod SHIFT, L, exec, hyprlock
bind = $mod, F1, exec, hypr-cheatsheet

# window cycling (alt-tab) - on ALT, not SUPER
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,

# SUPER+Tab opens the Hyprspace visual workspace overview (click a
# workspace, or drag a window into one, to switch); SHIFT+Tab still just
# steps back one workspace with no visuals
bind = $mod, Tab, overview:toggle
bind = $mod SHIFT, Tab, workspace, e-1

# focus movement
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# window movement
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# screenshots: region -> annotate/markup in swappy, then save or copy from
# its own panel (ShareX-style); full screen -> straight to file + clipboard
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim - | tee ~/Pictures/screenshot-$(date +%s).png | wl-copy

# workspaces: $mod + [1-9,0] -> switch, $mod SHIFT + [1-9,0] -> move window
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# tap SUPER by itself (no other key) to open the app launcher, same as
# pressing the Windows key does on Windows. bindr fires on *release*,
# which is what makes a modifier-only tap work without clashing with
# every other $mod+key bind above.
bindr = $mod, SUPER_L, exec, pkill rofi || $menu

# media / volume / brightness - routed through swayosd-client so the
# on-screen popup shows up on every press, instead of calling
# wpctl/brightnessctl directly. AGS still reads the same
# wireplumber/pipewire stack for its own volume widget.
binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
binde = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
binde = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
binde = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
